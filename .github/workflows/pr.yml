name: Pull Request Integration Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-quality-and-tests:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        run: npm run test

  soroban-contract-build-check:
    name: Soroban Contract Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Treasury Core Rust Tests
        run: |
          cd contracts/treasury_core
          cargo test

      - name: Run Community Reviews Rust Tests
        run: |
          cd contracts/community_reviews
          cargo test
